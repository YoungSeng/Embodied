# Merlin formal training: LocateAnything-3B UI CPT v2, HL H20 x4 safe SDPA profile.
# Submit: mlx job submitv2 --path locany_cpt_v4_h20x4_formal_merlin.yaml

caption: 'LocateAnything UI CPT v2 Formal - H20x4 SDPA'

jobDefVersion:
  entrypointMode: FULL_SCRIPT

  gitRepo:
    mnt: /mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT

  imageMeta:
    imageSource: url
    imageUrl: hub.byted.org/base/lab.cuda.devel:0ffcd17bfdf8d07a198e6cff167eae26
    imageVid: d8ap37f1enlcr23291ug

  lazyDownloadCode: true
  name: 'locany-cpt-v4-v2-h20x4-formal-continuous'

  resource:
    arnoldConfig:
      clusterId: 20
      elasticTraining: {}
      groupIds:
        - 1000
      bytenasVolumes:
        - name: intelligent-service-arnold-hl
          accessMode: RW
          roles:
            - worker
          subPath: ""
      keepMins: 1
      preemptible: false
      quotaPool: default
      roles:
        - name: worker
          num: 1
          cpu: 80
          gpu: 4
          gpuv: NVIDIA_H20
          queueName: compute-329-hl-cloudnative-ai-iesqa.llm4se-guarantee
          memory: 921600
          ports: 1
    backend: ARNOLD

  volumes:
    - volumeId: 18834
      mountPath: /mnt/bn/intelligent-service-arnold-hl

jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    PROJECT_ROOT=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT
    test -f "${PROJECT_ROOT}/shell/run_locany_cpt_merlin.sh"
    cd "${PROJECT_ROOT}"
    export PROJECT_ROOT
    export WORKSPACE=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace
    export CUDA_VISIBLE_DEVICES="${CUDA_DEVICES:-0,1,2,3}"
    exec bash shell/run_locany_cpt_merlin.sh h20 formal

  envsList:
    CUDA_DEVICES: "0,1,2,3"
    GPU_COUNT: "4"
    INSTALL_SYSTEM_RUNTIME_DEPS: "1"
    DATA_DIR: "/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/data/locany_cpt_v4_split_v2"
    RECIPE_NAME: "locany_cpt_train.json"
    # New continuous run: keep its checkpoints separate from eval-gated runs.
    RUN_NAME: "locany-3b-ui-cpt-v4-v2-h20x4-formal-continuous"
    ATTN_IMPLEMENTATION: "sdpa"
    MAX_SEQ_LENGTH: "7268"
    MAX_NUM_TOKENS_PER_SAMPLE: "7268"
    MAX_NUM_TOKENS: "7268"
    PACKING_BUFFER_SIZE: "16"
    GRADIENT_ACCUMULATION_STEPS: "2"
    MAX_STEPS: "20000"
    WARMUP_STEPS: "500"
    LEARNING_RATE: "5e-6"
    CPT_SAMPLING_MODE: "sample_equal"
    ENABLE_UI_RELATION: "False"
    SAVE_STEPS: "1000000000"
    # Rank 0 broadcasts the six-hour save decision; all four DeepSpeed ranks
    # remain in one uninterrupted torchrun and save together.
    SAVE_EVERY_N_HOURS: "6"
    SAVE_TOTAL_LIMIT: "20"
    CPT_INTEGRATED_EVAL: "0"
    CPT_EVAL_AT_START: "0"
    CPT_EXTERNAL_UI5_EVAL: "0"
    EVAL_IOU_THRESHOLD: "0.1"
    REPORT_TO: "tensorboard"

namespace: /user/sicheng.yang
