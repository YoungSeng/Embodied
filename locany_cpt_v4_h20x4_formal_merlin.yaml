# Merlin formal training: LocateAnything-3B UI CPT v2, HL H20 x4 safe SDPA profile.
# Submit: mlx job submitv2 --path locany_cpt_v4_h20x4_formal_merlin.yaml

caption: 'LocateAnything UI CPT v2 Formal - H20x4 SDPA'

jobDefVersion:
  entrypointMode: FULL_SCRIPT

  gitRepo:
    mnt: /mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT

  imageMeta:
    imageSource: url
    imageUrl: hub.byted.org/base/lab.cuda.devel:0ffcd17bfdf8d07a198e6cff167eae26
    imageVid: d8ap37f1enlcr23291ug

  lazyDownloadCode: true
  name: 'locany-cpt-v4-v2-h20x4-formal-eval0'

  resource:
    arnoldConfig:
      clusterId: 20
      elasticTraining: {}
      groupIds:
        - 1000
      bytenasVolumes:
        - name: intelligent-service-arnold-hl
          accessMode: RW
          roles:
            - worker
          subPath: ""
      keepMins: 1
      preemptible: false
      quotaPool: default
      roles:
        - name: worker
          num: 1
          cpu: 80
          gpu: 4
          gpuv: NVIDIA_H20
          queueName: compute-329-hl-cloudnative-ai-iesqa.llm4se-guarantee
          memory: 921600
          ports: 1
    backend: ARNOLD

  volumes:
    - volumeId: 18834
      mountPath: /mnt/bn/intelligent-service-arnold-hl

jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    PROJECT_ROOT=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT
    test -f "${PROJECT_ROOT}/shell/run_locany_cpt_merlin.sh"
    cd "${PROJECT_ROOT}"
    export PROJECT_ROOT
    export WORKSPACE=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace
    export CUDA_VISIBLE_DEVICES="${CUDA_DEVICES:-0,1,2,3}"
    exec bash shell/run_locany_cpt_merlin.sh h20 formal

  envsList:
    CUDA_DEVICES: "0,1,2,3"
    GPU_COUNT: "4"
    INSTALL_SYSTEM_RUNTIME_DEPS: "1"
    DATA_DIR: "/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/data/locany_cpt_v4_split_v2"
    RECIPE_NAME: "locany_cpt_train.json"
    # New directory: never resume the formal run that started before step-0 eval.
    RUN_NAME: "locany-3b-ui-cpt-v4-v2-h20x4-formal-eval0"
    ATTN_IMPLEMENTATION: "sdpa"
    MAX_SEQ_LENGTH: "7268"
    MAX_NUM_TOKENS_PER_SAMPLE: "7268"
    MAX_NUM_TOKENS: "7268"
    PACKING_BUFFER_SIZE: "16"
    GRADIENT_ACCUMULATION_STEPS: "2"
    MAX_STEPS: "20000"
    WARMUP_STEPS: "500"
    LEARNING_RATE: "5e-6"
    SAVE_STEPS: "1000000000"
    # Every completed wall-clock interval produces a resumable checkpoint;
    # this same x4 job then releases torchrun and evaluates held-out plus
    # external UI5 on GPU 0 before resuming x4.
    SAVE_EVERY_N_HOURS: "6"
    SAVE_TOTAL_LIMIT: "20"
    CPT_INTEGRATED_EVAL: "1"
    # Both Base evaluations must pass before optimizer step 1.
    CPT_EVAL_AT_START: "1"
    CPT_EXTERNAL_UI5_EVAL: "1"
    CPT_EXTERNAL_UI5_DATA_DIR: "/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/data"
    # Fixed hash subset sampled only from the image-group held-out pool.
    EVAL_RECIPE_NAME: "locany_cpt_val_fast.json"
    EVAL_SAMPLES_PER_TASK: "10"
    EVAL_MAX_PENDING: "20"
    EVAL_ATTN_IMPLEMENTATION: "sdpa"
    EVAL_VISION_ATTN_IMPLEMENTATION: "flash_attention_2"
    EVAL_DTYPE: "bf16"
    EVAL_MAX_NEW_TOKENS: "1024"
    EVAL_EXTERNAL_MAX_NEW_TOKENS: "4096"
    EVAL_EXTERNAL_MAX_IMAGES_PER_TASK: "0"
    REPORT_TO: "tensorboard"

namespace: /user/sicheng.yang
