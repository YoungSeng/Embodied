# Merlin / Arnold formal training: LocateAnything-3B, UI 5 classes, A800 x 8.
# Submit from the Embodied project root:
#   mlx job submitv2 --path jobs/locany_ui5_v3_a800x8_merlin.yaml

caption: 'LocateAnything UI5 Formal Training - A800x8'

jobDefVersion:
  entrypointMode: FULL_SCRIPT

  gitRepo:
    mnt: /mnt/bn/intelligent-service-yg/logging/sicheng_workspace/code/Eagle/Embodied

  imageMeta:
    imageSource: url
    imageUrl: hub.byted.org/base/lab.cuda.devel:0ffcd17bfdf8d07a198e6cff167eae26
    imageVid: d8ap37f1enlcr23291ug

  lazyDownloadCode: true
  name: 'locany-ui5-v3-a800x8'

  resource:
    arnoldConfig:
      clusterId: 24
      elasticTraining: {}

      groupIds:
        - 1602

      bytenasVolumes:
        - name: intelligent-service-yg
          accessMode: RW
          roles:
            - worker
          subPath: ""

      keepMins: 1
      preemptible: false
      quotaPool: default

      roles:
        - name: worker
          num: 1
          cpu: 116
          gpu: 8
          gpuv: A800_SXM_40GB
          memory: 262144
          ports: 1

    backend: ARNOLD

  volumes:
    - volumeId: 19922
      mountPath: /mnt/bn/intelligent-service-yg

jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    echo "===== Begin LocateAnything formal training ====="

    WORKSPACE=/mnt/bn/intelligent-service-yg/logging/sicheng_workspace
    PROJECT_ROOT=${WORKSPACE}/code/Eagle/Embodied
    ENV_DIR=${WORKSPACE}/conda_envs/LocateAnything
    JOB_ID=${ARNOLD_TRIAL_ID:-${ARNOLD_JOB_ID:-manual-$$}}
    LOCAL_RUNTIME_DIR=/tmp/locany-${JOB_ID}

    mkdir -p \
      "${WORKSPACE}/cache/huggingface/hub" \
      "${WORKSPACE}/cache/huggingface/datasets" \
      "${WORKSPACE}/cache/pip" \
      "${WORKSPACE}/cache/torch" \
      "${WORKSPACE}/gui_models" \
      "${LOCAL_RUNTIME_DIR}/tmp" \
      "${LOCAL_RUNTIME_DIR}/triton" \
      "${LOCAL_RUNTIME_DIR}/torchinductor" \
      "${LOCAL_RUNTIME_DIR}/torch_extensions" \
      "${LOCAL_RUNTIME_DIR}/xdg"

    export http_proxy=http://sys-proxy-rd-relay.byted.org:8118
    export https_proxy=${http_proxy}
    export HTTP_PROXY=${http_proxy}
    export HTTPS_PROXY=${https_proxy}
    export HF_ENDPOINT=http://huggingface-proxy-sg.byted.org
    export no_proxy="localhost,127.0.0.1,::1,.byted.org,huggingface-proxy-sg.byted.org"
    export NO_PROXY=${no_proxy}
    export HF_HUB_ETAG_TIMEOUT=60
    export HF_HUB_DOWNLOAD_TIMEOUT=600

    export PATH=${ENV_DIR}/bin:${PATH}
    export CONDA_PREFIX=${ENV_DIR}
    export PYTHONPATH=${PROJECT_ROOT}:${PYTHONPATH:-}
    export PYTHONUNBUFFERED=1
    export TOKENIZERS_PARALLELISM=false
    export HF_HUB_DISABLE_TELEMETRY=1
    export CUDA_DEVICE_ORDER=PCI_BUS_ID
    export NCCL_DEBUG=WARN
    export NCCL_ASYNC_ERROR_HANDLING=1
    export OMP_NUM_THREADS=8

    export TMPDIR=${LOCAL_RUNTIME_DIR}/tmp
    export TEMP=${TMPDIR}
    export TMP=${TMPDIR}
    export TRITON_CACHE_DIR=${LOCAL_RUNTIME_DIR}/triton
    export TORCHINDUCTOR_CACHE_DIR=${LOCAL_RUNTIME_DIR}/torchinductor
    export TORCH_EXTENSIONS_DIR=${LOCAL_RUNTIME_DIR}/torch_extensions
    export XDG_CACHE_HOME=${LOCAL_RUNTIME_DIR}/xdg
    export PIP_CACHE_DIR=${WORKSPACE}/cache/pip
    export TORCH_HOME=${WORKSPACE}/cache/torch

    # These three variables were missing from the previous YAML but are
    # required by shell/train_locany_ui_defect.sh.
    export PROJECT_ROOT
    export OUTPUT_BASE=${WORKSPACE}/gui_models
    export HF_HOME=${WORKSPACE}/cache/huggingface

    test -d "${PROJECT_ROOT}" || {
      echo "ERROR: Project directory not found: ${PROJECT_ROOT}" >&2
      exit 20
    }
    test -x "${ENV_DIR}/bin/python" || {
      echo "ERROR: Python environment not found: ${ENV_DIR}" >&2
      exit 21
    }
    test -f "${PROJECT_ROOT}/shell/run_locany_ui_defect.sh" || {
      echo "ERROR: Profile launcher not found" >&2
      exit 22
    }

    cd "${PROJECT_ROOT}"
    python --version
    nvidia-smi
    df -h /tmp /mnt/bn/intelligent-service-yg || true

    # PROFILE selects all machine defaults. Individual values below remain
    # explicit so the formal job is reproducible from the YAML alone.
    ROOT_PATH=${WORKSPACE} \
    CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
    GPUS=8 \
    DATA_VERSION=v3 \
    VERSION=v3 \
    MODEL_PATH=${WORKSPACE}/models/LocateAnything-3B \
    META_PATH=${PROJECT_ROOT}/data/ui_defect_locany_v3/recipe/ui_defect_5class_train.json \
    RUN_NAME=locany-3b-ui5-a800-full-v3-en \
    ATTN_IMPLEMENTATION=sdpa \
    MAX_SEQ_LENGTH=8192 \
    MAX_NUM_TOKENS_PER_SAMPLE=8192 \
    MAX_NUM_TOKENS=25600 \
    PACKING_BUFFER_SIZE=32 \
    DATALOADER_NUM_WORKERS=4 \
    MAX_STEPS=25000 \
    WARMUP_STEPS=500 \
    LEARNING_RATE=2e-5 \
    LOGGING_STEPS=1 \
    SAVE_STEPS=2000 \
    SAVE_TOTAL_LIMIT=1000 \
    SAMPLE_LOG_INTERVAL=5 \
    REPORT_TO=tensorboard \
    SAVE_EVERY_N_HOURS=0 \
    bash shell/run_locany_ui_defect.sh a800

  envsList:
    CUDA_DEVICES: "0,1,2,3,4,5,6,7"
    DATA_VERSION: "v3"
    VERSION: "v3"

namespace: /user/sicheng.yang
