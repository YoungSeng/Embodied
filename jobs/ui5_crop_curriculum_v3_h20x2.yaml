# Formal H20x2 resource/profile template. The foreground v3 renderer binds the
# hour021 selection/PNGs + NEW text-v3-1 JSONLs, recipe/text hashes, fresh output,
# code SHA and actual old raw. UI5_TRAIN_TEXT_IDENTITY / UI5_TRAIN_RECIPE_SHA256 /
# META_PATH / CURRICULUM_DATA_DIR are required and filled by the renderer.
# Submit with scripts/ui5_curriculum_v3.py --previous-submission-dir ... --submit.
# Submit the GENERATED formal.yaml, not this unbound resource template.
caption: UI5 Crop Curriculum v3 H20x2
namespace: /user/sicheng.yang
jobDefVersion:
  entrypointMode: FULL_SCRIPT
  gitRepo:
    mnt: /mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Embodied-ui5-curriculum
  imageMeta:
    imageSource: url
    imageUrl: hub.byted.org/base/lab.cuda.devel:0ffcd17bfdf8d07a198e6cff167eae26
    imageVid: d8ap37f1enlcr23291ug
  lazyDownloadCode: true
  name: ui5-crop-curriculum-v3-h20x2
  resource:
    arnoldConfig:
      clusterId: 20
      elasticTraining: {}
      groupIds: [1000]
      bytenasVolumes:
        - name: intelligent-service-arnold-hl
          accessMode: RW
          roles: [worker]
          subPath: ""
      keepMins: 1
      preemptible: false
      quotaPool: default
      roles:
        - name: worker
          num: 1
          cpu: 40
          gpu: 2
          gpuv: NVIDIA_H20
          queueName: compute-329-hl-cloudnative-ai-iesqa.llm4se-guarantee
          memory: 460800
          ports: 1
    backend: ARNOLD
  volumes:
    - volumeId: 18834
      mountPath: /mnt/bn/intelligent-service-arnold-hl
jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    : "${PROJECT_ROOT:?render with scripts/ui5_curriculum_v3.py first}"
    : "${CODE_REVISION:?renderer must bind the code SHA}"
    cd "${PROJECT_ROOT}"
    test "$(git rev-parse HEAD)" = "${CODE_REVISION}"
    exec bash shell/run_ui5_crop_curriculum_v3_h20x2.sh
  envsList:
    UI5_CURRICULUM_PROFILE: global_replay_v3
    TOTAL_STEPS: "1200"
    EVAL_INTERVAL_STEPS: "200"
    HARD_RATIOS: 0.20,0.25,0.30
    ANCHOR_RATIOS: 0.20,0.25,0.30
    GLOBAL_REPLAY_RATIOS: 0.60,0.50,0.40
    LLM_LRS: 1e-6,7e-7,5e-7
    ATTN_IMPLEMENTATION: sdpa
    MAX_SEQ_LENGTH: "7268"
    MAX_NUM_TOKENS_PER_SAMPLE: "7268"
    MAX_NUM_TOKENS: "7268"
    CHECKPOINT_SAVE_POLICY: best_only
    ROLLING_CHECKPOINT_DIR: resume/latest
    UI5_GPU0_WORKERS: "2"
    UI5_GPU1_WORKERS: "3"
