# Generated by scripts/submit_locany_ui5.py. Do not put pipeline logic here.
caption: '@@CAPTION@@'

jobDefVersion:
  entrypointMode: FULL_SCRIPT

  gitRepo:
    mnt: @@PROJECT_ROOT@@

  imageMeta:
    imageSource: url
    imageUrl: @@IMAGE_URL@@
    imageVid: @@IMAGE_VID@@

  lazyDownloadCode: true
  name: '@@JOB_NAME@@'

  resource:
    arnoldConfig:
      clusterId: @@CLUSTER_ID@@
      elasticTraining: {}
      groupIds:
        - @@GROUP_ID@@
      bytenasVolumes:
        - name: @@BYTENAS_NAME@@
          accessMode: RW
          roles:
            - worker
          subPath: ""
      keepMins: 1
      preemptible: false
      quotaPool: default
      roles:
        - name: worker
          num: 1
          cpu: @@CPU@@
          gpu: @@GPU_COUNT@@
          gpuv: @@GPUV@@
          memory: @@MEMORY@@
          ports: 1
@@QUEUE_NAME_LINE@@
    backend: ARNOLD

  volumes:
    - volumeId: @@VOLUME_ID@@
      mountPath: @@MOUNT_PATH@@

jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    export PROJECT_ROOT=@@PROJECT_ROOT@@
    export ENV_DIR=@@ENV_DIR@@
    export PATH="${ENV_DIR}/bin:${PATH}"
    cd "${PROJECT_ROOT}"
    exec bash shell/run_locany_ui5_pipeline.sh

  envsList:
@@ENVS_LIST@@

namespace: /user/sicheng.yang
