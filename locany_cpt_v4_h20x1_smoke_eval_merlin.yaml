# Independent acceptance evaluator for the deterministic H20x2 CPT v2 smoke run.
# Submit only after checkpoint-20 exists:
# mlx job submitv2 --path locany_cpt_v4_h20x1_smoke_eval_merlin.yaml

caption: 'LocateAnything UI CPT v2 Smoke Held-out Eval - H20x1 SDPA'

jobDefVersion:
  entrypointMode: FULL_SCRIPT

  gitRepo:
    mnt: /mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT

  imageMeta:
    imageSource: url
    imageUrl: hub.byted.org/base/lab.cuda.devel:0ffcd17bfdf8d07a198e6cff167eae26
    imageVid: d8ap37f1enlcr23291ug

  lazyDownloadCode: true
  name: 'locany-cpt-v4-v2-h20x1-smoke-heldout-eval'

  resource:
    arnoldConfig:
      clusterId: 20
      elasticTraining: {}
      groupIds:
        - 1000
      bytenasVolumes:
        - name: intelligent-service-arnold-hl
          accessMode: RW
          roles:
            - worker
          subPath: ""
      keepMins: 1
      preemptible: false
      quotaPool: default
      roles:
        - name: worker
          num: 1
          cpu: 24
          gpu: 1
          gpuv: NVIDIA_H20
          queueName: compute-329-hl-cloudnative-ai-iesqa.llm4se-guarantee
          memory: 230400
          ports: 1
    backend: ARNOLD

  volumes:
    - volumeId: 18834
      mountPath: /mnt/bn/intelligent-service-arnold-hl

jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    PROJECT_ROOT=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT
    test -f "${PROJECT_ROOT}/shell/run_locany_cpt_eval_merlin.sh"
    cd "${PROJECT_ROOT}"
    export PROJECT_ROOT
    export WORKSPACE=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace
    export CUDA_VISIBLE_DEVICES="${CUDA_DEVICES:-0}"
    exec bash shell/run_locany_cpt_eval_merlin.sh h20

  envsList:
    CUDA_DEVICES: "0"
    DATA_DIR: "/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/data/locany_cpt_v4_split_v2_smoke"
    RUN_NAME: "locany-3b-ui-cpt-v4-v2-h20x2-smoke"
    EVAL_SAMPLES_PER_TASK: "10"
    EVAL_MAX_PENDING: "2"
    EVAL_ATTN_IMPLEMENTATION: "sdpa"
    EVAL_VISION_ATTN_IMPLEMENTATION: "sdpa"
    EVAL_DTYPE: "bf16"
    EVAL_MAX_NEW_TOKENS: "1024"

namespace: /user/sicheng.yang
