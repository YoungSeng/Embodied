# Merlin smoke test: LocateAnything-3B UI CPT v2, HL H20 x2 safe SDPA profile.
# Submit: mlx job submitv2 --path locany_cpt_v4_h20x2_smoke_merlin.yaml

caption: 'LocateAnything UI CPT v2 Smoke - H20x2 SDPA'

jobDefVersion:
  entrypointMode: FULL_SCRIPT

  gitRepo:
    mnt: /mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT

  imageMeta:
    imageSource: url
    imageUrl: hub.byted.org/base/lab.cuda.devel:0ffcd17bfdf8d07a198e6cff167eae26
    imageVid: d8ap37f1enlcr23291ug

  lazyDownloadCode: true
  name: 'locany-cpt-v4-v2-h20x2-smoke'

  resource:
    arnoldConfig:
      clusterId: 20
      elasticTraining: {}
      groupIds:
        - 1000
      bytenasVolumes:
        - name: intelligent-service-arnold-hl
          accessMode: RW
          roles:
            - worker
          subPath: ""
      keepMins: 1
      preemptible: false
      quotaPool: default
      roles:
        - name: worker
          num: 1
          cpu: 40
          gpu: 2
          gpuv: NVIDIA_H20
          queueName: compute-329-hl-cloudnative-ai-iesqa.llm4se-guarantee
          memory: 460800
          ports: 1
    backend: ARNOLD

  volumes:
    - volumeId: 18834
      mountPath: /mnt/bn/intelligent-service-arnold-hl

jobRunParams:
  entrypointFullScript: |
    set -Eeuo pipefail
    PROJECT_ROOT=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/code/Eagle/Embodied-CPT
    test -f "${PROJECT_ROOT}/shell/run_locany_cpt_merlin.sh"
    cd "${PROJECT_ROOT}"
    export PROJECT_ROOT
    export WORKSPACE=/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace
    export CUDA_VISIBLE_DEVICES="${CUDA_DEVICES:-0,1}"
    exec bash shell/run_locany_cpt_merlin.sh h20 smoke

  envsList:
    CUDA_DEVICES: "0,1"
    GPU_COUNT: "2"
    DATA_DIR: "/mnt/bn/intelligent-service-arnold-hl/logging/sicheng_workspace/data/locany_cpt_v4_split_v2_smoke"
    RECIPE_NAME: "locany_cpt_smoke.json"
    RUN_NAME: "locany-3b-ui-cpt-v4-v2-h20x2-smoke"
    ATTN_IMPLEMENTATION: "sdpa"
    MAX_SEQ_LENGTH: "7268"
    MAX_NUM_TOKENS_PER_SAMPLE: "7268"
    MAX_NUM_TOKENS: "7268"
    PACKING_BUFFER_SIZE: "16"
    GRADIENT_ACCUMULATION_STEPS: "4"
    MAX_STEPS: "20"
    WARMUP_STEPS: "0"
    LEARNING_RATE: "5e-6"
    SAVE_STEPS: "20"
    SAVE_EVERY_N_HOURS: "0"
    SAVE_TOTAL_LIMIT: "2"
    CPT_METRICS_INTERVAL: "5"
    CPT_TABLE_INTERVAL: "20"
    CPT_SMOKE_RESUME_STEP: "10"
    REPORT_TO: "none"

namespace: /user/sicheng.yang
